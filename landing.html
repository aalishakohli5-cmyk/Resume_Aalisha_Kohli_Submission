<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#02040d">
    <meta name="description" content="Enter Aalisha Kohli's portfolio. A cinematic interactive space cadet experience.">
    <title>Enter the portfolio | Aalisha Kohli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="landing.css">
</head>
<body class="landing-page">
    <main class="space-stage" id="stage">
        <img class="space-plate" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/a194141a-44ba-44bb-8372-e6720af994ca.jpg" alt="Space cadet in front of a glowing orange planet" fetchpriority="high">
        <div class="space-shade" aria-hidden="true"></div>
        <video class="head-turn" id="headTurn" muted playsinline preload="auto" aria-hidden="true">
            <source src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e1b48476-24ab-456a-bb12-13e63bc60973.mp4" type="video/mp4">
        </video>
        <img class="helmet" id="helmet" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e8c78660-4497-41b9-82ae-a4738a5edd11.jpg" alt="" aria-hidden="true">

        <div class="hero-copy">
            <h1 class="hero-title entrance">Hey, I'm<br>Alisha Puri</h1>
        </div>

        <a class="enter-button entrance" href="index.html" aria-label="Push me to enter the portfolio"><span>PUSH<br>ME</span></a>
        <div class="cursor-dot" aria-hidden="true"></div>
        <div class="cursor-ring" aria-hidden="true"></div>
    </main>
    <script src="landing.js"></script>
</body>
</html>
